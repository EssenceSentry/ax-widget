name: macOS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      intel:
        description: Use an Intel macOS runner for the universal build
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  native:
    runs-on: ${{ inputs.intel && 'macos-15-intel' || 'macos-15' }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          xcodebuild -version
          swift --version
      - name: Test core behavior
        run: swift test --jobs 2
      - name: Install project generator
        run: brew install xcodegen
      - name: Build app and real WidgetKit extension
        run: scripts/build.sh
      - name: Verify embedded extension
        run: |
          test -x 'dist/AX Widget.app/Contents/PlugIns/AXWidgetExtension.appex/Contents/MacOS/AXWidgetExtension'
          codesign --verify --deep --strict 'dist/AX Widget.app'
          ditto -c -k --sequesterRsrc --keepParent 'dist/AX Widget.app' dist/AX-Widget-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AX-Widget-macOS
          path: dist/AX-Widget-macOS.zip
          retention-days: 14
